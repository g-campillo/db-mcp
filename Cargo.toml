[package]
name = "db-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server that runs SQL against PostgreSQL, SQL Server or Oracle with per-project permissions gating"
license = "ISC"
publish = false

[dependencies]
anyhow = "1.0.104"
humantime = "2.4.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
